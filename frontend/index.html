<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times do Campeonato</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main class="container">
        <h1>Times do Campeonato</h1>

        <section class="form-section">
            <h2>Cadastrar time</h2>

            <form id="form-time">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" required>

                <label for="fundacao">Ano de fundação</label>
                <input type="number" id="fundacao" min="1800" required>

                <label for="tecnico">Técnico</label>
                <input type="text" id="tecnico" required>

                <label class="checkbox-label" for="ativo">
                    <input type="checkbox" id="ativo" checked>
                    Ativo
                </label>

                <button type="submit">Cadastrar time</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="times-section">
            <h2>Times cadastrados</h2>

            <div id="lista-times"></div>
        </section>
    </main>

    <script src="scripts/app.js"></script>
</body>
</html>
